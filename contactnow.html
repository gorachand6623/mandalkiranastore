<!-- Modern & Attractive Place Delivery Order Form -->
      <div class="contact-form-card" id="order-form-box" style="background: linear-gradient(145deg, #ffffff, #f0fdf4); border: 2px solid #bbf7d0; border-radius: 24px; padding: 35px; box-shadow: 0 20px 25px -5px rgba(21, 128, 61, 0.1), 0 8px 10px -6px rgba(21, 128, 61, 0.1);">
        
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 22px; border-bottom: 2px dashed #dcfce7; padding-bottom: 16px;">
          <div style="background: #15803d; color: #ffffff; width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 8px 16px rgba(21, 128, 61, 0.25);">
            <i class="fa-solid fa-basket-shopping"></i>
          </div>
          <div>
            <h3 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.4rem; font-weight: 800; color: #14532d; margin-bottom: 4px;">Express Grocery Order</h3>
            <p style="color: #4b5563; font-size: 0.88rem; font-weight: 500;">Select your items & get doorstep delivery in Barbad.</p>
          </div>
        </div>

        <form id="store-order-form">
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="customer_name" style="font-weight: 700; color: #1e293b; font-size: 0.9rem; margin-bottom: 6px; display: block;">
              <i class="fa-solid fa-user-shield" style="color: #15803d; margin-right: 6px;"></i> Full Name
            </label>
            <input type="text" id="customer_name" class="form-input" placeholder="e.g. Gorachand Mandal" required style="border-radius: 12px; border: 1.5px solid #cbd5e1; padding: 12px 16px; width: 100%; transition: all 0.3s;" />
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label for="phone_number" style="font-weight: 700; color: #1e293b; font-size: 0.9rem; margin-bottom: 6px; display: block;">
              <i class="fa-solid fa-phone-volume" style="color: #15803d; margin-right: 6px;"></i> Mobile Number (WhatsApp)
            </label>
            <input type="tel" id="phone_number" class="form-input" placeholder="e.g. 6204339748" required style="border-radius: 12px; border: 1.5px solid #cbd5e1; padding: 12px 16px; width: 100%;" />
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label for="delivery_address" style="font-weight: 700; color: #1e293b; font-size: 0.9rem; margin-bottom: 6px; display: block;">
              <i class="fa-solid fa-map-location-dot" style="color: #15803d; margin-right: 6px;"></i> Delivery Address / Landmark
            </label>
            <input type="text" id="delivery_address" class="form-input" placeholder="e.g. Near kali Mandir, Barbad (828109)" required style="border-radius: 12px; border: 1.5px solid #cbd5e1; padding: 12px 16px; width: 100%;" />
          </div>

          <div class="form-group" style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; color: #1e293b; font-size: 0.9rem;">
              <i class="fa-solid fa-list-check" style="color: #15803d; margin-right: 6px;"></i> Select Items & Enter Quantity:
            </label>
            
            <!-- यह डिब्बा script.js से आटोमेटिक भरेगा -->
            <div id="dynamic-form-items" style="display: flex; flex-direction: column; gap: 10px; background: #ffffff; padding: 14px; border-radius: 16px; border: 1.5px solid #bbf7d0; max-height: 300px; overflow-y: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
              <!-- Items will load automatically via JS -->
            </div>
          </div>

          <div style="background: #dcfce7; border: 1px solid #86efac; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-size: 0.88rem; color: #166534; display: flex; align-items: center; gap: 10px; font-weight: 600;">
            <i class="fa-solid fa-truck-fast" style="font-size: 1.2rem; color: #15803d;"></i>
            <span>Free doorstep delivery on orders above Rs.499 in Barbad!</span>
          </div>

          <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #15803d, #166534); color: #ffffff; padding: 15px; border-radius: 14px; font-weight: 800; font-size: 1.05rem; width: 100%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 20px rgba(21, 128, 61, 0.3); transition: transform 0.2s, box-shadow 0.2s;">
            <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> Send Order on WhatsApp Now
          </button>
        </form>
      </div>
